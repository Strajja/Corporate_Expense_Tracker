# ===============================
# 1. DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cet_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 2. JPA / HIBERNATE CONFIGURATION
# ===============================
# Hibernate ce automatski napraviti ili azurirati tabele na osnovu nasih @Entity klasa
spring.jpa.hibernate.ddl-auto=update

# Prikazuje SQL upite u konzoli (odlicno za debagovanje dok razvijamo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specifikacija baze
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 3. SERVER CONFIGURATION
# ===============================
# Backend ce trcati na portu 8080 (Next.js frontend trci na 3000)
server.port=8080