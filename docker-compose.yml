services:
  cet_backend_db:
    image: postgres:16-alpine
    container_name: cet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cet_db
    ports:
      - "5433:5432"
    volumes:
      - backend_data:/var/lib/postgresql/data
    restart: unless-stopped

  cet_worker_db:
    image: postgres:16-alpine
    container_name: postgres_worker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cet_worker_db
    ports:
      - "5434:5432"
    volumes:
      - worker_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cet_user
      RABBITMQ_DEFAULT_PASS: cet_password
    restart: unless-stopped

volumes:
  backend_data:
  worker_data: